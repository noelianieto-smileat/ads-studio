<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SMILEAT ADS STUDIO</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Nunito:wght@800;900&display=swap">
<style>
:root{color-scheme:light;--bg:#FFFFFF;--sf:#fff;--tx:#003F6D;--mu:#6B7488;--ln:#D3ECF8;--pr:#00A2E1;--pr2:#003F6D;--yl:#FDCD2B;--pk:#FE2675;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:400 15px/1.5 Montserrat,system-ui,sans-serif}
h1,h2,h3,.n{font-family:Nunito,system-ui,sans-serif;font-weight:900;margin:0}
h2{font-size:28px;color:var(--pr)}h3{font-size:18px}
button,input,select,textarea{font:inherit;color:inherit}
.btn{background:var(--pr);color:#fff;border:0;border-radius:999px;padding:10px 20px;font-weight:600;cursor:pointer}
.btn.big{font:900 20px Nunito;padding:18px 34px;background:var(--pr);color:#fff;box-shadow:0 6px 0 var(--pr2)}
.btn.ghost{background:transparent;border:2px solid var(--ln);color:var(--tx)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--pk);outline-offset:2px}
header{background:var(--pr);color:#fff;border:0!important;display:flex;align-items:center;gap:16px;padding:12px 24px;border-bottom:2px solid var(--ln);flex-wrap:wrap}
.logo{font:900 26px Nunito;color:var(--pr)}
nav{display:flex;gap:4px;flex:1;flex-wrap:wrap}
nav button{background:none;border:0;padding:8px 14px;border-radius:999px;cursor:pointer;font-weight:600;color:#fff}
nav button.on{background:#fff;color:var(--pr2)}
header .btn.ghost{border-color:#fff;color:#fff}
main{max-width:1180px;margin:0 auto;padding:28px 24px 80px}
.hero{padding:48px 0 24px}.hero h1{font-size:clamp(36px,6vw,64px);line-height:1.02;max-width:14ch;color:var(--pr)}
.hero p{max-width:52ch;color:var(--mu);margin:16px 0 28px}
.links{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}
.card{background:var(--sf);border:2px solid var(--ln);border-radius:16px;overflow:hidden}
.pick{cursor:pointer;text-align:left;padding:0;display:block;width:100%}
.pick.on{border-color:var(--pr);box-shadow:0 0 0 3px var(--pr)}
.pick img,.ph{width:100%;aspect-ratio:1;object-fit:contain;background:#f3ecd9;display:grid;place-items:center;color:var(--mu);font-size:12px;text-align:center;padding:8px}
.pick .t{padding:10px 12px}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.chip{border:2px solid var(--ln);background:var(--sf);border-radius:999px;padding:10px 18px;cursor:pointer;font-weight:600}
.chip.on{background:var(--pr);border-color:var(--pr);color:#fff}
.steps{display:flex;gap:6px;margin-bottom:24px}.steps i{flex:1;height:8px;border-radius:9px;background:var(--ln)}.steps i.on{background:var(--pr)}
.bar{display:flex;gap:12px;justify-content:space-between;margin-top:28px}
.note{background:var(--sf);border-left:6px solid var(--yl);padding:12px 16px;border-radius:8px;color:var(--mu);font-size:13px;margin:16px 0}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--ln);color:var(--tx);margin:2px 4px 2px 0}
.tag.ok{background:#CFF3E7;color:#0F5C4C}.tag.aj{background:#FFE9A8;color:#6A4B00}.tag.rv{background:#FFD0DC;color:#7A1632}
.gc canvas{width:100%;display:block;background:#eee}.gc .b{padding:10px 12px;font-size:13px}
.gc .b b{display:block;font:900 15px Nunito}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.tool{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
.tool input,.tool select,.f input,.f select,.f textarea{border:2px solid var(--ln);background:var(--sf);border-radius:10px;padding:8px 12px;width:100%}
.tool input,.tool select{width:auto}
dialog{border:0;border-radius:20px;padding:24px;background:var(--bg);color:var(--tx);max-width:960px;width:94vw}
dialog::backdrop{background:rgba(20,28,45,.6)}
.ed{display:grid;grid-template-columns:1.2fr 1fr;gap:24px}.ed canvas{width:100%;border-radius:12px;background:#eee}
@media(max-width:760px){.ed{grid-template-columns:1fr}}
.f label{display:block;font-weight:600;font-size:13px;margin:10px 0 4px}
.login{min-height:80vh;display:grid;place-items:center}.login .card{padding:32px;max-width:420px;width:100%}
.err{color:#C0264B;font-size:13px;min-height:20px}
table{border-collapse:collapse;width:100%;font-size:14px}td,th{padding:8px;border-bottom:1px solid var(--ln);text-align:left;vertical-align:top}
.prog{height:12px;background:var(--ln);border-radius:9px;overflow:hidden;margin:12px 0}.prog i{display:block;height:100%;background:var(--pr);width:0;transition:width .2s}
</style></head><body>

 const cy=land?H-pad-ch:Math.min(y+m*.03,box.y-ch-m*.02);
 c.fillStyle=tc===('#FFFFFF')?b:tc;c.beginPath();c.roundRect(pad,cy,cw,ch,ch/2);c.fill();
 c.fillStyle=(tc==='#FFFFFF')?'#23304A':a;c.fillText(s.cta,pad+m*.04,cy+ch*.65)}
function nav(v){view=v;if(v==='new'){step=0;gen=null}render()}
function render(){
 const A=$('#app');
 if(!user){A.innerHTML=`<div class="login"><div class="card f"><img src="${ASSETS.logo}" alt="smileat" style="height:44px"><h2>ADS STUDIO</h2><p>Herramienta interna de Marketing. Entra con tu correo corporativo.</p><label for="em">Correo corporativo</label><input id="em" type="email" placeholder="nombre@smileat.com"><div class="err" id="er"></div><button class="btn" id="go">Entrar</button><div class="note">Modo demostración: el dominio solo se comprueba en el navegador y no hay sesión real. Antes de publicar hay que activar Google OAuth y validar @smileat.com en el servidor (ver «Estado»).</div></div></div>`;
  $('#go').onclick=()=>{const e=$('#em').value.trim().toLowerCase();if(!/^[^@\s]+@smileat\.com$/.test(e)){$('#er').textContent='Solo se permiten cuentas @smileat.com.';return}user=e;render()};return}
 const N=[['home','Inicio'],['new','Crear'],['gal','Galería'],['lib','Productos y recursos'],['kb','Centro de conocimiento'],['st','Estado']];
 A.innerHTML=`<header><img src="${ASSETS.logoW}" alt="smileat" style="height:34px"><nav>${N.map(n=>`<button class="${view===n[0]?'on':''}" onclick="nav('${n[0]}')">${n[1]}</button>`).join('')}</nav><span style="font-size:13px;color:#fff">${esc(user)}</span><button class="btn ghost sm" onclick="(window.top||window).location.href='/'">Volver al inicio</button></header><main id="mn"></main>`;
 ({home:vHome,new:vNew,gal:vGal,lib:vLib,kb:vKb,st:vSt})[view]()}
function vHome(){$('#mn').innerHTML=`<div class="hero"><h1>SMILEAT ADS STUDIO</h1><p>Crea, revisa y descarga creatividades para Meta Ads y TikTok Ads en España, Portugal e Italia, con el tono y los recursos de Smileat.</p><button class="btn big" onclick="nav('new')">CREAR NUEVAS CREATIVIDADES</button><div class="links"><button class="btn ghost" onclick="nav('gal')">Galería (${db.cre.length})</button><button class="btn ghost" onclick="flt.fav=true;nav('gal')">Favoritos</button><button class="btn ghost" onclick="nav('lib')">Productos y recursos</button><button class="btn ghost" onclick="nav('kb')">Centro de conocimiento</button></div></div>`}
const SN=['Productos','Mercados','Formatos','Canales','Tipo de creatividad','Cantidad','Generar'];
function chips(list,key,lab){return`<div class="chips">${list.map(v=>`<button class="chip ${sel[key].includes(v)?'on':''}" onclick="toggle(sel.${key},'${v}');render()">${lab?lab[v]||v:v}</button>`).join('')}</div>`}
function vNew(){const ok=[sel.p.length,sel.m.length,sel.f.length,sel.c.length,sel.t.length,1,1][step];
 let h=`<div class="steps">${SN.map((_,i)=>`<i class="${i<=step?'on':''}"></i>`).join('')}</div><h2>Paso ${step+1}. ${SN[step]}</h2><br>`;
 if(step===0){h+=db.prods.length?`<div class="grid">${db.prods.map(p=>`<button class="card pick ${sel.p.includes(p.id)?'on':''}" onclick="toggle(sel.p,'${p.id}');render()">${p.img?`<img src="${p.img}" alt="">`:'<div class="ph">Sin foto</div>'}<div class="t"><b>${esc(p.name)}</b><br><span style="color:var(--mu);font-size:12px">${esc(p.cat||'')}</span></div></button>`).join('')}</div>`:`<div class="note">Aún no hay productos. Añade los productos reales (con su foto original) en «Productos y recursos». No se inventan productos.</div><button class="btn" onclick="nav('lib')">Ir a Productos</button>`}
 if(step===1)h+=chips(Object.keys(MK),'m',MK);
 if(step===2)h+=chips(Object.keys(FM),'f',{'1:1':'1:1 · 1080×1080','4:5':'4:5 · 1080×1350','9:16':'9:16 · 1080×1920','16:9':'16:9 · 1920×1080'})+`<div class="note">Cada formato se recompone (titular, producto y zonas seguras), no se recorta.</div>`;
 if(step===3)h+=chips(['Meta Ads','TikTok Ads'],'c');
 if(step===4)h+=chips(TY,'t');
 if(step===5)h+=`<div class="chips">${[5,10,20,30].map(n=>`<button class="chip ${sel.n===n?'on':''}" onclick="sel.n=${n};render()">${n}</button>`).join('')}<input type="number" min="1" max="30" value="${sel.n}" style="width:90px;border:2px solid var(--ln);border-radius:999px;padding:8px 14px;background:var(--sf)" onchange="sel.n=Math.max(1,Math.min(30,+this.value||5));render()"></div><div class="note">Cada concepto se crea en todos los mercados y formatos elegidos.</div>`;
 if(step===6){const tot=sel.n*sel.m.length*sel.f.length;h+=`<div class="card" style="padding:20px"><p><b>Productos:</b> ${sel.p.map(i=>esc(db.prods.find(p=>p.id===i).name)).join(', ')}<br><b>Mercados:</b> ${sel.m.join(', ')}<br><b>Formatos:</b> ${sel.f.join(', ')}<br><b>Canales:</b> ${sel.c.join(', ')}<br><b>Tipos:</b> ${sel.t.join(', ')}<br><b>Conceptos:</b> ${sel.n} → <b>${tot} piezas</b></p></div><div class="note">Modo demostración: las piezas se componen en el navegador con la foto original del producto y textos genéricos aprobables. No hay conexión a un generador de imágenes con IA todavía.</div>${gen?`<div class="prog"><i style="width:${gen.d/gen.t*100}%"></i></div><p>${gen.d} de ${gen.t} generadas</p>`:`<button class="btn big" onclick="generate()">GENERAR CREATIVIDADES</button>`}`}
 h+=`<div class="bar"><button class="btn ghost" ${step?'':'disabled'} onclick="step--;render()">Atrás</button>${step<6?`<button class="btn" ${ok?'':'disabled'} onclick="step++;render()">Siguiente</button>`:''}</div>`;
 $('#mn').innerHTML=h}
async function generate(){
 const tot=sel.n*sel.m.length*sel.f.length;gen={d:0,t:tot};render();
 for(let i=0;i<sel.n;i++){const pid=sel.p[i%sel.p.length],type=sel.t[i%sel.t.length],ch=sel.c[i%sel.c.length],st=(i*2+sel.t.indexOf(type))%6,p=db.prods.find(x=>x.id===pid);
  for(const m of sel.m)for(const f of sel.f){const [h,c]=copy(m,type,p.name);
   db.cre.unshift({id:uid(),pid,mk:m,fmt:f,ch,type,style:st,head:h,cta:c,fav:false,date:Date.now(),demo:true,ver:1,fruit:(i%3===1&&type!=='Comparativa')?Object.keys(ASSETS.fruits)[(i*3)%19]:''});gen.d++;
   if(view==='new'&&step===6){const pr=document.querySelector('.prog i');if(pr)pr.style.width=gen.d/gen.t*100+'%'}
   await new Promise(r=>setTimeout(r,20))}}
 save();gen=null;nav('gal')}
function vGal(){
 const L=db.cre.filter(s=>{const p=db.prods.find(x=>x.id===s.pid);return(!flt.q||(s.head+(p?p.name:'')).toLowerCase().includes(flt.q.toLowerCase()))&&(!flt.m||s.mk===flt.m)&&(!flt.f||s.fmt===flt.f)&&(!flt.t||s.type===flt.t)&&(!flt.fav||s.fav)});
 $('#mn').innerHTML=`<h2>Galería</h2><div class="tool"><input placeholder="Buscar" value="${esc(flt.q)}" oninput="flt.q=this.value;clearTimeout(window.tq);window.tq=setTimeout(vGal,300)"><select onchange="flt.m=this.value;vGal()"><option value="">Mercado</option>${Object.keys(MK).map(m=>`<option ${flt.m===m?'selected':''}>${m}</option>`).join('')}</select><select onchange="flt.f=this.value;vGal()"><option value="">Formato</option>${Object.keys(FM).map(m=>`<option ${flt.f===m?'selected':''}>${m}</option>`).join('')}</select><select onchange="flt.t=this.value;vGal()"><option value="">Tipo</option>${TY.map(m=>`<option ${flt.t===m?'selected':''}>${m}</option>`).join('')}</select><button class="chip ${flt.fav?'on':''}" onclick="flt.fav=!flt.fav;vGal()">Favoritos</button></div>${L.length?`<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(240px,1fr))">${L.map(s=>{const p=db.prods.find(x=>x.id===s.pid),r=review(s);return`<div class="card gc"><canvas data-id="${s.id}" style="cursor:pointer" onclick="edit('${s.id}')"></canvas><div class="b"><b>${esc(s.head)}</b>${esc(p?p.name:'—')}<br><span class="tag">${s.mk}</span><span class="tag">${s.fmt}</span><span class="tag">${s.ch}</span><span class="tag">${s.type}</span><span class="tag">${new Date(s.date).toLocaleDateString('es-ES')}</span><span class="tag">Demo</span><br><span class="tag ${r[0]}">${r[1]}</span><div class="row"><button class="btn sm" onclick="edit('${s.id}')">Editar</button><button class="btn sm ghost" onclick="fav('${s.id}')">${s.fav?'★ Favorita':'☆ Favorita'}</button><button class="btn sm ghost" onclick="dl('${s.id}')">Descargar</button></div></div></div>`}).join('')}</div>`:`<div class="note">No hay creatividades${db.cre.length?' con estos filtros':' todavía'}. Pulsa Crear para generar las primeras.</div>`}`;
 document.querySelectorAll('canvas[data-id]').forEach(cv=>draw(cv,db.cre.find(x=>x.id===cv.dataset.id)))}
function fav(id){const s=db.cre.find(x=>x.id===id);s.fav=!s.fav;save();vGal()}
async function dl(id){const s=db.cre.find(x=>x.id===id),p=db.prods.find(x=>x.id===s.pid),cv=document.createElement('canvas');await draw(cv,s);
 const a=document.createElement('a');a.href=cv.toDataURL('image/png');a.download=[s.mk,(p?p.name:'producto'),s.type,s.ch.split(' ')[0],s.fmt.replace(':','x'),'v'+s.ver].join('_').replace(/\s+/g,'-')+'.png';a.click()}
function edit(id){const s=db.cre.find(x=>x.id===id),d=$('#dlg');
 d.innerHTML=`<div class="ed"><canvas id="ec"></canvas><div class="f"><h3>Editar creatividad</h3><label>Titular</label><textarea id="eh" rows="2">${esc(s.head)}</textarea><label>CTA</label><input id="ecta" value="${esc(s.cta)}"><label>Mercado (recarga el texto base del mercado)</label><select id="em2">${Object.keys(MK).map(m=>`<option ${s.mk===m?'selected':''}>${m}</option>`).join('')}</select><label>Formato (se recompone)</label><select id="ef">${Object.keys(FM).map(m=>`<option ${s.fmt===m?'selected':''}>${m}</option>`).join('')}</select><label>Icono de fruta oficial</label><select id="efr"><option value="">Ninguno</option>${Object.entries(ASSETS.fruits).map(([k,v])=>`<option value="${k}" ${s.fruit==k?'selected':''}>${v[0]}</option>`).join('')}</select><label>Estilo visual</label><select id="es">${STY.map((_,i)=>`<option value="${i}" ${s.style===i?'selected':''}>Estilo ${i+1}</option>`).join('')}</select><div class="note">Revisión automática básica (longitud, foto, tipo sensible). No sustituye la aprobación de Marketing.</div><div class="row"><button class="btn" id="sv">Guardar cambios</button><button class="btn ghost" id="cp">Guardar como copia</button><button class="btn ghost" id="rm">Eliminar</button><button class="btn ghost" id="cl">Cerrar</button></div></div></div>`;
 const cur=()=>({...s,head:$('#eh').value,cta:$('#ecta').value,mk:$('#em2').value,fmt:$('#ef').value,style:+$('#es').value,fruit:$('#efr').value});
 const pv=()=>draw($('#ec'),cur());pv();['eh','ecta','es','ef','efr'].forEach(i=>$('#'+i).oninput=pv);
 $('#em2').onchange=()=>{const [h,c]=copy($('#em2').value,s.type,(db.prods.find(x=>x.id===s.pid)||{name:'Smileat'}).name);$('#eh').value=h;$('#ecta').value=c;pv()};
 $('#sv').onclick=()=>{Object.assign(s,cur(),{ver:s.ver+1});save();d.close();vGal()};
 $('#cp').onclick=()=>{db.cre.unshift({...cur(),id:uid(),date:Date.now(),fav:false,ver:1});save();d.close();vGal()};
 $('#rm').onclick=()=>{if(confirm('¿Eliminar esta creatividad? No se puede deshacer.')){db.cre=db.cre.filter(x=>x.id!==id);save();d.close();vGal()}};
 $('#cl').onclick=()=>d.close();d.showModal()}
function shrink(file,max){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;const x=c.getContext('2d');x.drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/png'))};i.src=fr.result};fr.readAsDataURL(file)})}
function vLib(){$('#mn').innerHTML=`<h2>Productos y recursos</h2><div class="note">Sube la foto original del producto (se usa sin modificar el envase). Logo, colores e iconos de frutas del template de Smileat ya están integrados.</div><div class="card f" style="padding:20px;max-width:520px"><h3>Importar varios productos de golpe</h3><label>Selecciona todas las fotos a la vez (el nombre del archivo será el nombre del producto)</label><input id="bf" type="file" accept="image/*" multiple><label>Opcional: CSV con columnas nombre,categoria (si coincide con el nombre del archivo, se asigna la categoría)</label><input id="bc" type="file" accept=".csv,text/csv"><br><br><button class="btn" id="bi">Importar</button><p id="bs" style="font-size:13px;color:var(--mu)"></p></div><br><div class="card f" style="padding:20px;max-width:520px"><h3>Añadir producto</h3><label>Nombre</label><input id="pn"><label>Categoría</label><input id="pc"><label>Foto original (PNG con fondo transparente recomendado)</label><input id="pf" type="file" accept="image/*"><br><br><button class="btn" id="pa">Añadir producto</button></div><br><div class="grid">${db.prods.map(p=>`<div class="card">${p.img?`<img src="${p.img}" alt="" style="width:100%;aspect-ratio:1;object-fit:contain;background:#f3ecd9">`:'<div class="ph">Sin foto</div>'}<div style="padding:10px 12px"><b>${esc(p.name)}</b><br><span style="color:var(--mu);font-size:12px">${esc(p.cat||'')}</span><div class="row"><button class="btn sm ghost" onclick="delP('${p.id}')">Eliminar</button></div></div></div>`).join('')}</div>`;
 $('#bi').onclick=async()=>{const fs=[...$('#bf').files];if(!fs.length){alert('Selecciona las fotos de producto.');return}const cat={};const cf=$('#bc').files[0];if(cf){(await cf.text()).split(/\r?\n/).slice(1).forEach(l=>{const p=l.split(/[;,]/);if(p[0])cat[p[0].trim().toLowerCase()]=(p[1]||'').trim()})}let n=0;for(const f of fs){$('#bs').textContent='Importando '+(++n)+' de '+fs.length+'…';const nm=f.name.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ').trim();if(db.prods.some(p=>p.name.toLowerCase()===nm.toLowerCase()))continue;db.prods.push({id:uid(),name:nm,cat:cat[nm.toLowerCase()]||'',img:await shrink(f,700)})}save();vLib()};
 $('#pa').onclick=async()=>{const n=$('#pn').value.trim();if(!n){alert('Escribe el nombre del producto.');return}const f=$('#pf').files[0];db.prods.push({id:uid(),name:n,cat:$('#pc').value.trim(),img:f?await shrink(f,700):''});save();vLib()}}
function delP(id){if(confirm('¿Eliminar este producto?')){db.prods=db.prods.filter(p=>p.id!==id);sel.p=sel.p.filter(x=>x!==id);save();vLib()}}
function vKb(){$('#mn').innerHTML=`<h2>Centro de conocimiento Smileat</h2><div class="note">Aquí se guardan los documentos de referencia (texto). En esta versión se almacenan pero todavía no los consulta ningún modelo de IA: la generación demo usa textos genéricos y marca como «Requiere revisión» los mensajes sensibles.</div><div class="card f" style="padding:20px;max-width:520px"><label>Nombre del documento</label><input id="dn"><label>Archivo de texto (.txt, .md)</label><input id="df" type="file" accept=".txt,.md,text/plain"><br><br><button class="btn" id="da">Guardar documento</button></div><br><table><tr><th>Documento</th><th>Fecha</th><th></th></tr>${db.docs.map(d=>`<tr><td>${esc(d.name)}</td><td>${new Date(d.date).toLocaleDateString('es-ES')}</td><td><button class="btn sm ghost" onclick="db.docs=db.docs.filter(x=>x.id!=='${d.id}');save();vKb()">Eliminar</button></td></tr>`).join('')}</table>`;
 $('#da').onclick=async()=>{const f=$('#df').files[0],n=$('#dn').value.trim()||(f&&f.name);if(!f){alert('Selecciona un archivo de texto.');return}db.docs.push({id:uid(),name:n,text:(await f.text()).slice(0,200000),date:Date.now()});save();vKb()}}
function vSt(){const R=[['Operativo','Flujo de 7 pasos, selección de productos, mercados, formatos, canales, tipos y cantidad','Galería con filtros y buscador, favoritos, editor de texto/formato/estilo, duplicar, eliminar con confirmación, versiones, descarga PNG a tamaño real, guardado en este navegador'],['Demo','Acceso (comprobación @smileat.com solo en el navegador)','Generación: composición propia con la foto original del producto y textos genéricos por mercado; revisión de marca automática básica'],['Pendiente','Google OAuth y validación de dominio en servidor; roles Administrador/Usuario','Generación de imágenes con IA y textos con modelo; lectura real de manuales; base de datos y almacenamiento en servidor; editor con arrastrar y soltar y deshacer; plantillas; ZIP por mercado/producto/campaña/canal/formato; bocadillos y otros iconos; biblioteca de recursos subible']];
 $('#mn').innerHTML=`<h2>Estado de funcionalidades</h2><br><table>${R.map(r=>`<tr><th>${r[0]}</th><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}</table><div class="note">Los datos se guardan solo en este navegador. Logo, paleta (azul, marino, rosa, verde, naranja, morado, amarillo) y fuentes Nunito/Montserrat tomados del template.</div>`}
render();
</script></body></html>
